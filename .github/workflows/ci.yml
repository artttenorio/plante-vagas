name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      DIRECT_URL: "postgresql://test:test@localhost:5432/test"
      JWT_SECRET: "ci-test-secret"
      FRONTEND_URL: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (informational, not blocking yet)
        run: npm run lint || true

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Apply migrations (banco descartável do runner)
        run: npx prisma migrate deploy

      - name: E2E / smoke tests
        run: npm run test:e2e

      - name: Security tests (IDOR, senhas, injeção, bots)
        run: npm run test:security

  client:
    name: Client (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (informational, not blocking yet)
        run: npm run lint || true

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # CD: a cada push na main, depois que server e client passaram, publica na EC2 (AWS)
  deploy:
    name: Deploy (AWS EC2)
    needs: [server, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    environment:
      name: producao
      url: https://plantevagas.com.br
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Credenciais (chave SSH e .env de producao)
        run: |
          mkdir -p ~/.ssh infra/.state
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/plante-vagas-aws.pem
          chmod 600 ~/.ssh/plante-vagas-aws.pem
          echo "${{ secrets.PROD_ENV }}" > infra/.state/.env
          chmod 600 infra/.state/.env

      - name: Deploy
        run: ./infra/deploy.sh

      - name: Smoke test
        run: |
          curl -fsS -o /dev/null https://plantevagas.com.br/
          curl -fsS -o /dev/null https://plantevagas.com.br/api/vaga/find/all
